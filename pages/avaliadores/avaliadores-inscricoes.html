<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrições - Sistema de Inscrição</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/avaliadores/avaliador-inscricao.css">
    <link rel="stylesheet" href="../../css/usuarios/table.css">
    <link rel="stylesheet" href="../../css/usuarios/modal-inscricao.css">
    <link rel="stylesheet" href="../../css/notificacao.css">
    <link rel="stylesheet" href="../../css/avaliadores/graficos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Barra Lateral -->
        <aside class="sidebar">
            <img src="../../assets/img/logo-branco.png" alt="Logo do Instituto">
            <h2 class="title-side-bar">30 de Setembro</h2>
            <nav>
                <ul>
                   
                    <li><i data-lucide="circle-gauge"></i> <a href="avaliador-home.html">Análise</a> </li> 
                    <li class="active"><i data-lucide="file-text"></i> Inscrições</li>
                    <li><i data-lucide="calendar-days"></i> Calendário</li>
                    <li><i data-lucide="settings"></i> Configurações</li>

                    <a href=""> <li class="logout"> <a href="../../index.html"><i data-lucide="log-out"></i> Sair do sistema</a> </li></a>
                   
                </ul>
            </nav>
        </aside>
        
        <!-- Conteúdo Principal -->
        <main class="content">
            <header>
                <div class="title-header">
                    <h1>Incrições</h1>
                </div>
                <div class="container-notification">
                    <div id="notificacao-modal-container"></div>
                </div>
                <div class="user-info">
                    <i onclick="openModalNotifications()" class="fa-solid fa-bell notificacao" id="notificacao-inscricao-abrirModal"></i>
                    <i data-lucide="user"></i>
                    <span>Pedro.F</span>
                </div>
            </header>
          <!-- Barra de Pesquisa -->
          <div class="search-bar">
            <input type="text" placeholder="Pesquisar">
            <button class="filter-btn"><i class="fa-solid fa-filter"></i> Filtrar pesquisa</button>
        </div>
       <hr>
        
        </main>
    </div>

    <!-- Modal de Inscrição -->
    <div id="inscricao-modal-container"></div>

    <!-- Inicialização dos scripts -->
    <script src="../../js/usuarios/modalConfig.js"></script>
    
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
